<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pictogram Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#16202E; --muted:#667085; --line:#E2E6EE;
  --brand:#0E7C86; --brand-ink:#FFFFFF; --brand-soft:#E3F4F5; --danger:#C2412D;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.top{background:#10263A;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:10px;background:#16A3AE;display:grid;place-items:center}
.top h1{font-size:20px;margin:0;line-height:1.2}
.top p{margin:0;font-size:13px;color:#B9C7D6}
.lang{margin-left:auto;display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#DCE6F0;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:600}
.lang button.on{background:#fff;color:#10263A}
.wrap{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:20px;padding:20px 24px;max-width:1500px;margin:0 auto;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.num{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center;flex:none}
.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none;transition:border .15s}
.field:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.mt{margin-top:8px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tr{display:grid;grid-template-columns:1fr 120px 34px;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr input{border:0;padding:8px 10px;min-width:0;outline:none;background:transparent}
.tr input:focus{background:var(--brand-soft)}
.tr input+input{border-left:1px solid var(--line)}
.th-row{background:#F7F9FC}
.th-row input{font-weight:700;font-size:14px}
.rows{max-height:290px;overflow:auto}
.del{border:0;background:transparent;color:#98A2B3;cursor:pointer;font-size:18px;border-left:1px solid var(--line)}
.del:hover{color:var(--danger);background:#FDF0EE}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn svg{width:16px;height:16px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cat{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.02em}
.cat:first-child{margin-top:0}
.charts{max-height:430px;overflow:auto;padding-right:4px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chart-opt{border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:5px;cursor:pointer;text-align:center;font-size:12px;line-height:1.25;transition:.15s}
.chart-opt:hover{border-color:#9CC9CD}
.chart-opt.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 2px var(--brand-soft)}
.thumb{height:62px;border-radius:6px;overflow:hidden;margin-bottom:4px;background:#fafafa}
.thumb svg{width:100%;height:100%;display:block}
.thumb svg text{display:none}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icons-box{max-height:330px;overflow:auto;padding-right:4px}
.icons-box .cat{margin:10px 0 6px}
.icon-tools{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-bottom:8px}
.icon-sel{font-size:13.5px;color:var(--muted);margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.icon-sel b{color:var(--ink)}
.icon-sel .chip{margin-left:auto}
.icon-opt{aspect-ratio:1;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;display:grid;place-items:center;padding:7px}
.icon-opt svg{width:100%;height:100%;fill:#344054}
.icon-opt.on{border-color:var(--brand);background:var(--brand-soft)}
.icon-opt.on svg{fill:var(--brand)}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
.row2 label{display:flex;gap:6px;align-items:center;cursor:pointer}
.unit{width:120px}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.theme-opt{border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;cursor:pointer;text-align:left;font-size:13px}
.theme-opt.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.sw{display:flex;height:14px;border-radius:4px;overflow:hidden;margin-top:4px}
.sw span{flex:1}
.actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);padding:16px 0 6px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.act{white-space:nowrap;border:0;border-radius:12px;padding:12px 8px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.act svg{width:18px;height:18px}
.act.primary{background:var(--brand);color:#fff}
.act.primary:hover{background:#0B6A73}
.act.dl{background:#10263A;color:#fff}
.act.dl:disabled{opacity:.4;cursor:not-allowed}
.act.rs{background:#fff;border:1px solid var(--line);color:var(--danger)}
.stage{position:sticky;top:20px}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.stage-head h2{margin:0;font-size:16px}
.chip{font-size:12.5px;background:var(--brand-soft);color:var(--brand);padding:4px 10px;border-radius:999px;font-weight:600}
.preview{background:repeating-conic-gradient(#EEF1F5 0% 25%,#fff 0% 50%) 50%/22px 22px;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:420px;display:grid;place-items:center;overflow:auto}
.preview svg{width:100%;height:auto;max-width:960px;border-radius:8px;box-shadow:0 4px 24px rgba(16,24,40,.12)}
.empty{color:var(--muted);text-align:center;padding:40px}
.empty svg{width:64px;height:64px;fill:#C5CDD8;margin-bottom:8px}
.status{min-height:22px;font-size:13.5px;margin-top:10px;color:var(--muted)}
.status.err{color:var(--danger);font-weight:600}
.status.ok{color:#127A3E}
input[type=file]{display:none}
@media (max-width:980px){.wrap{grid-template-columns:1fr;padding:14px}.stage{position:static}.cgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:420px){.cgrid{grid-template-columns:repeat(2,1fr)}.themes{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM9 8h6a2 2 0 0 1 2 2v6h-2v6h-2.2v-6h-1.6v6H9v-6H7v-6a2 2 0 0 1 2-2z"/></svg></div>
  <div><h1>Pictogram Studio</h1><p data-i18n="tagline"></p></div>
  <div class="lang"><button id="lang-th" class="on">ไทย</button><button id="lang-en">English</button></div>
</header>

<main class="wrap">
  <section>
    <div class="card">
      <h2><span class="num">1</span><span data-i18n="s1"></span></h2>
      <input id="title" class="field" data-ph="phTitle">
      <input id="subtitle" class="field mt" data-ph="phSub">
    </div>

    <div class="card">
      <h2><span class="num">2</span><span data-i18n="s2"></span></h2>
      <div class="tbl">
        <div class="tr th-row"><input id="colName" title="Edit column name"><input id="colValue" title="Edit column name"><span></span></div>
        <div class="rows" id="rows"></div>
      </div>
      <p class="hint" data-i18n="colHint"></p>
      <div class="btns">
        <button class="btn" id="addRow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg><span data-i18n="addRow"></span></button>
        <button class="btn" id="uploadBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 2.5L17.5 9H13zM8.5 18l2.3-3.5L8.6 11h1.9l1.4 2.3 1.4-2.3h1.8l-2.2 3.5 2.4 3.5h-1.9l-1.5-2.4-1.5 2.4z"/></svg><span data-i18n="upload"></span></button>
        <button class="btn" id="sampleBtn"><span data-i18n="sample"></span></button>
        <button class="btn" id="templateBtn"><span data-i18n="template"></span></button>
      </div>
      <input type="file" id="file" accept=".xlsx,.xls,.csv,.ods">
      <p class="hint" data-i18n="uploadHint"></p>
    </div>

    <div class="card">
      <h2><span class="num">3</span><span data-i18n="s3"></span> <span class="chip" id="chartCount">30</span></h2>
      <div class="charts" id="charts"></div>
    </div>

    <div class="card">
      <h2><span class="num">4</span><span data-i18n="s4"></span></h2>
      <div class="icon-tools"><select id="iconCat" class="field"></select><input id="iconSearch" class="field" data-ph="iconSearch"></div>
      <div class="icon-sel"><span data-i18n="selected"></span> <b id="iconName"></b> <span class="chip" id="iconCount"></span></div>
      <div class="icons-box" id="icons"></div>
      <div class="row2">
        <label><input type="checkbox" id="vary"> <span data-i18n="vary"></span></label>
      </div>
      <div class="row2"><label><input type="checkbox" id="fit" checked> <span data-i18n="fit"></span></label></div>
      <div class="row2"><span data-i18n="unitLbl"></span><input id="unit" class="field unit" type="number" min="0" step="any" data-ph="auto"></div>
      <p class="hint" data-i18n="unitHint"></p>
    </div>

    <div class="card">
      <h2><span class="num">5</span><span data-i18n="s5"></span></h2>
      <div class="themes" id="themes"></div>
    </div>

    <div class="card">
      <h2><span class="num">6</span><span data-i18n="s6"></span></h2>
      <input id="source" class="field" data-ph="phSource">
    </div>

    <div class="actions">
      <button class="act primary" id="processBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span data-i18n="process"></span></button>
      <button class="act dl" id="downloadBtn" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3zM4 18h16v2H4z"/></svg><span data-i18n="download"></span></button>
      <button class="act rs" id="resetBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg><span data-i18n="reset"></span></button>
    </div>
  </section>

  <section class="stage">
    <div class="card">
      <div class="stage-head"><h2 data-i18n="preview"></h2><span class="chip" id="curChart"></span></div>
      <div class="preview" id="preview"></div>
      <div class="status" id="status"></div>
    </div>
  </section>
</main>

/* ---------- helpers ---------- */
const r = v => Math.round(v * 10) / 10;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let _m = null;
function measure(str, size=14, w=400){
  if(!_m && typeof document !== 'undefined') _m = document.createElement('canvas').getContext('2d');
  if(!_m) return String(str).length * size * 0.55;
  _m.font = `${w} ${size}px ${FONT}`; return _m.measureText(String(str)).width;
}
function trunc(s, maxW, size=14, w=400){ s = String(s); if(measure(s,size,w) <= maxW) return s; while(s.length > 1 && measure(s+'…',size,w) > maxW) s = s.slice(0,-1); return s+'…'; }
const fmt = v => Number(v).toLocaleString(S.lang==='th'?'th-TH':'en-US', {maximumFractionDigits:2});
const pc = (v,tot) => tot ? (Math.round(v/tot*1000)/10).toLocaleString('en-US') + '%' : '0%';
function niceUnit(raw){ if(!(raw > 0)) return 1; const e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e; return [1,2,2.5,5,10].find(x => f <= x + 1e-9) * e; }
function hex2rgb(h){ h = h.replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join(''); return [0,2,4].map(i => parseInt(h.substr(i,2),16)); }
function mix(a,b,k){ const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v,i) => Math.round(v + (B[i]-v)*k).toString(16).padStart(2,'0')).join(''); }
function lum(h){ const [R,G,B] = hex2rgb(h).map(v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*R + 0.7152*G + 0.0722*B; }
const contrast = h => lum(h) > 0.45 ? '#1B1F27' : '#FFFFFF';
function alloc(vals, N){ const tot = vals.reduce((a,b)=>a+b,0); if(!tot) return vals.map(()=>0); const ex = vals.map(v => v/tot*N), fl = ex.map(Math.floor); let rem = N - fl.reduce((a,b)=>a+b,0); ex.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i]) => { if(rem>0){ fl[i]++; rem--; } }); return fl; }
function arcPath(cx,cy,R,a0,a1){ const p = a => [cx + R*Math.sin(a*Math.PI/180), cy - R*Math.cos(a*Math.PI/180)]; const [x0,y0] = p(a0), [x1,y1] = p(a1); return `M${r(x0)} ${r(y0)}A${R} ${R} 0 ${(a1-a0)>180?1:0} 1 ${r(x1)} ${r(y1)}`; }

let UID = 0, P = THEMES.ocean;
function ic(x,y,s,color,id,o={}){
  USED.add(id);
  const u = (fill,extra='') => `<use href="#i-${id}" x="${r(x)}" y="${r(y)}" width="${r(s)}" height="${r(s)}" fill="${fill}"${extra}/>`;
  if(o.frac != null && o.frac < 0.999){
    const f = clamp(o.frac,0,1), cid = 'cp' + (UID++);
    const rect = o.vertical ? `<rect x="${r(x)}" y="${r(y+s*(1-f))}" width="${r(s)}" height="${r(s*f)}"/>` : `<rect x="${r(x)}" y="${r(y)}" width="${r(s*f)}" height="${r(s)}"/>`;
    return u(o.empty || P.empty) + `<clipPath id="${cid}">${rect}</clipPath><g clip-path="url(#${cid})">${u(color)}</g>`;
  }
  return u(color, o.opacity != null ? ` opacity="${o.opacity}"` : '');
}
function tx(x,y,str,o={}){
  return `<text x="${r(x)}" y="${r(y)}" font-size="${o.size||14}" font-weight="${o.weight||400}" fill="${o.color||P.text}" text-anchor="${o.anchor||'start'}" dominant-baseline="${o.base||'central'}">${esc(str)}</text>`;
}
function runH(x,y,cnt,s,g,col,id,c){ let o='', full = Math.floor(cnt+1e-9), fr = cnt-full, k=0; for(; k<full; k++) o += ic(x+k*(s+g),y,s,col,id); if(fr > 0.04){ o += ic(x+k*(s+g),y,s,col,id,{frac:fr,empty:c.empty}); k++; } return {svg:o, end:x+k*(s+g)}; }
function gridRun(x,y,cnt,per,s,gx,gy,col,id,c){ let o='', n = Math.max(0, Math.ceil(cnt-0.04)); for(let k=0; k<n; k++){ const fr = Math.min(1, cnt-k); o += ic(x+(k%per)*(s+gx), y+Math.floor(k/per)*(s+gy), s, col, id, fr<0.999?{frac:fr,empty:c.empty}:{}); } return {svg:o, rows:Math.max(1, Math.ceil(n/per))}; }
function legendH(c,y,opt={}){ const rows=[[]]; let x=0; c.d.forEach(d => { const lab = d.name + (opt.pct ? ` · ${pc(d.value,c.total)}` : opt.val ? ` · ${fmt(d.value)}` : ''); const w = 22 + measure(lab,13) + 24; if(x+w > IW && x > 0){ rows.push([]); x = 0; } rows[rows.length-1].push({d,lab,x}); x += w; rows[rows.length-1].w = x - 24; });
  let o=''; rows.forEach((row,ri) => { const off = (IW - (row.w||0))/2, yy = y + ri*26; row.forEach(({d,lab,x}) => { o += `<rect x="${r(off+x)}" y="${r(yy)}" width="14" height="14" rx="3" fill="${c.col(d.i)}"/>` + tx(off+x+22, yy+7, lab, {size:13}); }); }); return {svg:o, h:(rows.length-1)*26+20}; }
function legendV(c,x,y,opt={}){ const nw = Math.min(240, Math.max(40, ...c.d.map(d => measure(d.name,14)))) + 22; let o=''; c.d.forEach((d,k) => { const yy = y + k*30; o += `<rect x="${r(x)}" y="${r(yy)}" width="16" height="16" rx="4" fill="${c.col(d.i)}"/>` + tx(x+26, yy+8, trunc(d.name, nw-10, 14), {size:14}) + tx(x+26+nw, yy+8, opt.pct ? pc(d.value,c.total) : fmt(d.value), {weight:700, color:c.col(d.i)}); }); return {svg:o, h:c.n*30}; }
const rowShift = (k,n,cols,cell) => { const last = Math.floor((n-1)/cols); if(Math.floor(k/cols) !== last) return 0; return (cols - (n - last*cols)) * cell / 2; };
const labelW = c => Math.min(200, Math.max(60, ...c.d.map(d => measure(d.name,14))) + 18);
const counts = (c,u) => c.d.map(d => Math.round(d.value/u));
function seqColors(c,cnts){ const arr=[]; cnts.forEach((n,k) => { for(let j=0;j<n;j++) arr.push(c.d[k]); }); return arr; }

/* ---------- Renderers ---------- */
const R = {
hbar(c){ const lw = labelW(c), s=26, g=6, cap = Math.floor((IW-lw-90)/(s+g)), u = c.U(c.max,cap), rh = s+16; let o='';
  c.d.forEach((d,k) => { const y = k*rh; o += tx(lw-12, y+s/2, trunc(d.name,lw-16), {anchor:'end'}); const run = runH(lw,y,d.value/u,s,g,c.col(d.i),c.icon(d.i),c); o += run.svg + tx(run.end+6, y+s/2, fmt(d.value), {weight:700, color:c.col(d.i)}); });
  return {svg:o, h:c.n*rh-16, unit:true}; },

vbar(c){ const cw = IW/c.n, s = clamp(cw*0.42, 12, 44), g=4, cap = Math.floor(360/(s+g)), u = c.U(c.max,cap), base = 26 + cap*(s+g); let o='';
  c.d.forEach((d,k) => { const cx = cw*k + cw/2, x = cx - s/2, cnt = d.value/u, full = Math.floor(cnt+1e-9), fr = cnt-full, col = c.col(d.i), id = c.icon(d.i);
    for(let j=0;j<full;j++) o += ic(x, base-(j+1)*(s+g), s, col, id);
    let top = base - full*(s+g); if(fr > 0.04){ o += ic(x, base-(full+1)*(s+g), s, col, id, {frac:fr, vertical:true, empty:c.empty}); top -= s+g; }
    o += tx(cx, top-6, fmt(d.value), {anchor:'middle', weight:700, color:col, size:13});
    o += tx(cx, base+12, trunc(d.name, cw-6, 13), {anchor:'middle', size:13}); });
  o += `<line x1="0" x2="${IW}" y1="${base+1}" y2="${base+1}" stroke="${P.muted}" stroke-opacity=".35"/>`;
  return {svg:o, h:base+26, unit:true}; },

hwrap(c){ const per=25, s=26, g=(IW-per*s)/(per-1), u = c.U(c.max,100); let o='', y=0;
  c.d.forEach(d => { o += tx(0, y+10, d.name, {weight:700, size:15}) + tx(IW, y+10, fmt(d.value), {anchor:'end', weight:700, color:c.col(d.i), size:15}); y += 26;
    const gr = gridRun(0,y,d.value/u,per,s,g,6,c.col(d.i),c.icon(d.i),c); o += gr.svg; y += gr.rows*(s+6) + 16; });
  return {svg:o, h:y-16, unit:true}; },

vstack(c){ const cw = IW/c.n, per=3, s = clamp((cw-14)/per-3, 8, 22), g=3, rows=20, u = c.U(c.max, per*rows), base = 26 + rows*(s+g); let o='';
  c.d.forEach((d,k) => { const cx = cw*k + cw/2, x0 = cx - (per*(s+g)-g)/2, cnt = d.value/u, n = Math.max(0, Math.ceil(cnt-0.04));
    for(let j=0;j<n;j++){ const fr = Math.min(1,cnt-j); o += ic(x0+(j%per)*(s+g), base-(Math.floor(j/per)+1)*(s+g), s, c.col(d.i), c.icon(d.i), fr<0.999?{frac:fr,empty:c.empty}:{}); }
    const top = base - Math.ceil(n/per)*(s+g); o += tx(cx, top-8, fmt(d.value), {anchor:'middle', weight:700, size:13, color:c.col(d.i)}) + tx(cx, base+12, trunc(d.name,cw-6,13), {anchor:'middle', size:13}); });
  return {svg:o, h:base+26, unit:true}; },

stream(c){ const u = c.U(c.total,200), cn = counts(c,u), seq = seqColors(c,cn), per=20, s = Math.min(36, IW/per-8), g = (IW-per*s)/(per-1); let o='';
  seq.forEach((d,k) => o += ic((k%per)*(s+g), Math.floor(k/per)*(s+8), s, c.col(d.i), c.icon(d.i)));
  const h = Math.ceil(seq.length/per)*(s+8); const lg = legendH(c, h+14, {val:true}); return {svg:o+lg.svg, h:h+14+lg.h, unit:true}; },

ranked(c){ const sd = [...c.d].sort((a,b) => b.value-a.value), lw = labelW(c), s=24, g=5, x0 = 44+lw, cap = Math.floor((IW-x0-90)/(s+g)), u = c.U(c.max,cap), rh = 44; let o='';
  sd.forEach((d,k) => { const y = k*rh, col = c.col(d.i); o += `<circle cx="15" cy="${y+s/2}" r="15" fill="${col}"/>` + tx(15, y+s/2, k+1, {anchor:'middle', weight:700, size:14, color:contrast(col)});
    o += tx(44, y+s/2, trunc(d.name,lw-10), {weight:600}); const run = runH(x0,y,d.value/u,s,g,col,c.icon(d.i),c); o += run.svg + tx(run.end+6, y+s/2, fmt(d.value), {weight:700, color:col}); });
  return {svg:o, h:c.n*rh-14, unit:true}; },

bignum(c){ const x0=230, s=30, g=6, cap = Math.floor((IW-x0)/(s+g)), u = c.U(c.max,cap), rh=78; let o='';
  c.d.forEach((d,k) => { const y = k*rh, col = c.col(d.i); o += tx(0, y+22, fmt(d.value), {size:32, weight:700, color:col}) + tx(0, y+52, trunc(d.name,210,14), {size:14, color:P.muted});
    o += runH(x0, y+22, d.value/u, s, g, col, c.icon(d.i), c).svg; if(k < c.n-1) o += `<line x1="0" x2="${IW}" y1="${y+rh-8}" y2="${y+rh-8}" stroke="${P.muted}" stroke-opacity=".2"/>`; });
  return {svg:o, h:c.n*rh-14, unit:true}; },

centered(c){ const lw = labelW(c), s=26, g=6, cap = Math.floor((IW-lw-20)/(s+g)), u = c.U(c.max,cap), rh = s+20, cx = lw + (IW-lw)/2; let o='';
  o += `<line x1="${cx}" x2="${cx}" y1="-6" y2="${c.n*rh-14}" stroke="${P.muted}" stroke-opacity=".25" stroke-dasharray="4 4"/>`;
  c.d.forEach((d,k) => { const y = k*rh, cnt = d.value/u, n = Math.ceil(cnt-0.04), w = n*(s+g)-g; o += tx(lw-12, y+s/2-7, trunc(d.name,lw-16), {anchor:'end', weight:600}) + tx(lw-12, y+s/2+10, fmt(d.value), {anchor:'end', size:12, color:c.col(d.i), weight:700});
    o += runH(cx-w/2, y, cnt, s, g, c.col(d.i), c.icon(d.i), c).svg; });

waffle(c){ const s=34, g=6, al = alloc(c.d.map(d=>d.value),100), seq = seqColors(c,al); let o='';
  for(let k=0;k<100;k++){ const d = seq[k]; o += ic((k%10)*(s+g), Math.floor(k/10)*(s+g), s, d?c.col(d.i):c.empty, d?c.icon(d.i):S.icon); }
  const gw = 10*(s+g)-g, lg = legendV(c, gw+40, 4, {pct:true}); o += lg.svg; o += tx(gw+40, Math.max(lg.h, 0)+20, (S.lang==='th'?'1 ไอคอน = 1%':'1 icon = 1%'), {size:13, color:P.muted});
  return {svg:o, h:Math.max(gw, lg.h+30)}; },

wafflemulti(c){ const s=13, g=3, bw = 10*(s+g)-g, cols = Math.max(1, Math.min(c.n, Math.floor((IW+20)/(bw+20)))), sp = cols>1 ? (IW-cols*bw)/(cols-1) : 0, bh = bw+58; let o='';
  c.d.forEach((d,k) => { const x0 = (k%cols)*(bw+sp) + rowShift(k,c.n,cols,bw+sp), y0 = Math.floor(k/cols)*bh, f = Math.round(d.value/c.total*100 || 0);
    for(let j=0;j<100;j++) o += ic(x0+(j%10)*(s+g), y0+Math.floor(j/10)*(s+g), s, j<f?c.col(d.i):c.empty, c.icon(d.i));
    o += tx(x0, y0+bw+18, pc(d.value,c.total), {size:18, weight:700, color:c.col(d.i)}) + tx(x0, y0+bw+40, trunc(d.name,bw,13), {size:13}); });
  return {svg:o, h:Math.ceil(c.n/cols)*bh-8}; },

percentrow(c){ const lw = labelW(c), s=34, g=8, rh=s+16; let o='';
  c.d.forEach((d,k) => { const y = k*rh, p = c.total ? d.value/c.total : 0; o += tx(lw-12, y+s/2, trunc(d.name,lw-16), {anchor:'end'});
    for(let j=0;j<10;j++){ const fr = clamp(p*10-j,0,1); o += ic(lw+j*(s+g), y, s, c.col(d.i), c.icon(d.i), {frac:fr, empty:c.empty}); }
    o += tx(lw+10*(s+g)+4, y+s/2, pc(d.value,c.total), {weight:700, size:16, color:c.col(d.i)}); });
  o += tx(0, c.n*rh+6, S.lang==='th'?'1 ไอคอน = 10% ของทั้งหมด':'1 icon = 10% of total', {size:12.5, color:P.muted});
  return {svg:o, h:c.n*rh+14}; },

squares(c){ const s=22, g=4, al = alloc(c.d.map(d=>d.value),200), seq = seqColors(c,al); let o='';
  for(let k=0;k<200;k++){ const d = seq[k]; o += `<rect x="${(k%20)*(s+g)}" y="${Math.floor(k/20)*(s+g)}" width="${s}" height="${s}" rx="4" fill="${d?c.col(d.i):c.empty}"/>`; }
  const gw = 20*(s+g)-g, gh = 10*(s+g)-g, lg = legendV(c, gw+36, 4, {pct:true}); o += lg.svg + tx(gw+36, lg.h+20, S.lang==='th'?'1 ช่อง = 0.5%':'1 square = 0.5%', {size:13, color:P.muted});
  return {svg:o, h:Math.max(gh, lg.h+30)}; },

iconfill(c){ const cols = Math.min(c.n, Math.max(1, Math.floor(IW/160))), cw = IW/cols, s = Math.min(120, cw-30), rh = s+78; let o='';
  c.d.forEach((d,k) => { const cx = (k%cols)*cw + cw/2 + rowShift(k,c.n,cols,cw), y = Math.floor(k/cols)*rh, f = c.max ? d.value/c.max : 0;
    o += ic(cx-s/2, y, s, c.col(d.i), c.icon(d.i), {frac:f, vertical:true, empty:c.empty}) + tx(cx, y+s+20, fmt(d.value), {anchor:'middle', size:22, weight:700, color:c.col(d.i)}) + tx(cx, y+s+46, trunc(d.name,cw-10,14), {anchor:'middle'}); });
  return {svg:o, h:Math.ceil(c.n/cols)*rh-14}; },

ringbadge(c){ const cols = Math.min(c.n, Math.max(1, Math.floor(IW/170))), cw = IW/cols, R0=58, rh=2*R0+80; let o='';
  c.d.forEach((d,k) => { const cx = (k%cols)*cw + cw/2 + rowShift(k,c.n,cols,cw), cy = Math.floor(k/cols)*rh + R0 + 6, p = c.total ? d.value/c.total : 0, col = c.col(d.i);
    o += `<circle cx="${r(cx)}" cy="${cy}" r="${R0}" fill="none" stroke="${c.empty}" stroke-width="11"/>`;
    o += p >= 0.999 ? `<circle cx="${r(cx)}" cy="${cy}" r="${R0}" fill="none" stroke="${col}" stroke-width="11"/>` : p > 0 ? `<path d="${arcPath(cx,cy,R0,0,p*360)}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"/>` : '';
    o += ic(cx-26, cy-26, 52, col, c.icon(d.i)) + tx(cx, cy+R0+24, pc(d.value,c.total), {anchor:'middle', size:20, weight:700, color:col}) + tx(cx, cy+R0+48, trunc(d.name,cw-10,14), {anchor:'middle'}); });
  return {svg:o, h:Math.ceil(c.n/cols)*rh-10}; },

scaled(c){ const maxS=170, gap=18; let sz = c.d.map(d => Math.max(14, maxS*Math.sqrt(c.max ? d.value/c.max : 0)));
  const tot = sz.reduce((a,b)=>a+b,0) + gap*(c.n-1); if(tot > IW){ const f = (IW-gap*(c.n-1))/(tot-gap*(c.n-1)); sz = sz.map(v => Math.max(10,v*f)); }
  const mS = Math.max(...sz), base = mS+32, tw = sz.reduce((a,b)=>a+b,0) + gap*(c.n-1); let x = (IW-tw)/2, o='';
  c.d.forEach((d,k) => { const s = sz[k], cx = x+s/2; o += ic(x, base-s, s, c.col(d.i), c.icon(d.i)) + tx(cx, base-s-12, fmt(d.value), {anchor:'middle', weight:700, size:14, color:c.col(d.i)}) + tx(cx, base+16, trunc(d.name, Math.max(s+gap-4,50), 13), {anchor:'middle', size:13}); x += s+gap; });
  return {svg:o, h:base+30}; },

bubbles(c){ const items = [...c.d].filter(d=>d.value>0).sort((a,b)=>b.value-a.value).map(d => ({d, rad: Math.max(14, 105*Math.sqrt(d.value/c.max))})), pl=[];
  items.forEach(it => { if(!pl.length){ pl.push({...it,x:0,y:0}); return; } for(let a=0;;a+=0.12){ const rr = 4+a*3.2, x = rr*Math.cos(a)*1.25, y = rr*Math.sin(a)*0.8; if(pl.every(p => Math.hypot(p.x-x,p.y-y) >= p.rad+it.rad+5)){ pl.push({...it,x,y}); break; } } });
  if(!pl.length) return {svg:'', h:40};
  const minX = Math.min(...pl.map(p=>p.x-p.rad)), maxX = Math.max(...pl.map(p=>p.x+p.rad)), minY = Math.min(...pl.map(p=>p.y-p.rad)), maxY = Math.max(...pl.map(p=>p.y+p.rad));
  const f = Math.min(1, IW/(maxX-minX)), ox = (IW-(maxX-minX)*f)/2 - minX*f, oy = -minY*f; let o='';
  pl.forEach(p => { const x = ox+p.x*f, y = oy+p.y*f, R = p.rad*f, col = c.col(p.d.i), tc = contrast(col); o += `<circle cx="${r(x)}" cy="${r(y)}" r="${r(R)}" fill="${col}"/>`;
    if(R > 40){ const s = R*0.62; o += ic(x-s/2, y-s*0.78, s, tc, c.icon(p.d.i), {opacity:.9}) + tx(x, y+R*0.3, fmt(p.d.value), {anchor:'middle', weight:700, size:clamp(R*0.26,12,22), color:tc}) + tx(x, y+R*0.56, trunc(p.d.name,R*1.5,12), {anchor:'middle', size:12, color:tc}); }
    else { const s = R*1.1; o += ic(x-s/2, y-s/2, s, tc, c.icon(p.d.i), {opacity:.9}); } });
  const h = (maxY-minY)*f, lg = legendH(c, h+20, {val:true}); return {svg:o+lg.svg, h:h+20+lg.h}; },

overlap(c){ const sd = [...c.d].sort((a,b)=>b.value-a.value), H=320, cx=170; let o='';
  sd.forEach(d => { const s = Math.max(10, H*Math.sqrt(c.max ? d.value/c.max : 0)); o += ic(cx-s/2, H-s, s, c.col(d.i), c.icon(d.i)); });
  const lg = legendV(c, 380, 8); o += lg.svg; return {svg:o, h:Math.max(H, lg.h+8)}; },

treemap(c){ const items = [...c.d].filter(d=>d.value>0).sort((a,b)=>b.value-a.value), out=[], H=440;
  (function tm(it,x,y,w,h){ if(!it.length) return; if(it.length===1){ out.push({d:it[0],x,y,w,h}); return; } const tot = it.reduce((a,b)=>a+b.value,0); let acc=0, k=0; while(k<it.length-1 && acc+it[k].value <= tot/2){ acc += it[k].value; k++; } if(k===0){ acc = it[0].value; k = 1; } const f = acc/tot, A = it.slice(0,k), B = it.slice(k); if(w>=h){ tm(A,x,y,w*f,h); tm(B,x+w*f,y,w*(1-f),h); } else { tm(A,x,y,w,h*f); tm(B,x,y+h*f,w,h*(1-f)); } })(items,0,0,IW,H);
  let o=''; out.forEach(b => { const col = c.col(b.d.i), tc = contrast(col); o += `<rect x="${r(b.x+2)}" y="${r(b.y+2)}" width="${r(Math.max(0,b.w-4))}" height="${r(Math.max(0,b.h-4))}" rx="8" fill="${col}"/>`;
    const s = Math.min(64, Math.min(b.w,b.h)*0.38); if(s > 10) o += ic(b.x+b.w/2-s/2, b.y+b.h/2-s*0.85, s, tc, c.icon(b.d.i), {opacity:.9});
    if(b.w > 70 && b.h > 70){ o += tx(b.x+b.w/2, b.y+b.h/2+s*0.35+8, fmt(b.d.value), {anchor:'middle', weight:700, size:18, color:tc}) + tx(b.x+b.w/2, b.y+b.h/2+s*0.35+30, trunc(b.d.name,b.w-14,13), {anchor:'middle', size:13, color:tc}); } });
  const lg = legendH(c, H+18, {pct:true}); return {svg:o+lg.svg, h:H+18+lg.h}; },

ring(c){ const u = c.U(c.total,120), seq = seqColors(c,counts(c,u)), N = seq.length, R0 = 175, s = Math.min(30, (2*Math.PI*R0/Math.max(N,1))*0.82), cx = R0+s/2+6, cy = R0+s/2+6; let o='';
  seq.forEach((d,k) => { const a = 2*Math.PI*k/N - Math.PI/2; o += ic(cx+R0*Math.cos(a)-s/2, cy+R0*Math.sin(a)-s/2, s, c.col(d.i), c.icon(d.i)); });
  o += tx(cx, cy-12, fmt(c.total), {anchor:'middle', size:36, weight:700}) + tx(cx, cy+22, t('total'), {anchor:'middle', size:15, color:P.muted});
  const lx = 2*cx+30, lg = legendV(c, lx, 20); o += lg.svg; return {svg:o, h:Math.max(2*cy, lg.h+20), unit:true}; },

concentric(c){ const n = c.n, r0=62, gap = n>1 ? Math.min(40, (215-r0)/(n-1)) : 40, s = Math.min(26, gap*0.72), Rm = r0+gap*(n-1), cx = IW/2+70, cy = Rm+s/2+6; let o='';
  c.d.forEach((d,k) => { const R0 = Rm - k*gap, cap = Math.max(1, Math.floor(1.5*Math.PI*R0/(s+3))), f = Math.round(cap*(c.max ? d.value/c.max : 0));
    for(let j=0;j<cap;j++){ const a = (j/(cap-1||1))*270*Math.PI/180 - Math.PI/2; o += ic(cx+R0*Math.cos(a)-s/2, cy+R0*Math.sin(a)-s/2, s, j<f?c.col(d.i):c.empty, c.icon(d.i)); }
    o += tx(cx-s/2-10, cy-R0, `${trunc(d.name,170,13)}  ${fmt(d.value)}`, {anchor:'end', size:13, weight:600, color:c.col(d.i)}); });
  return {svg:o, h:2*cy}; },

spiral(c){ const u = c.U(c.total,300), seq = seqColors(c,counts(c,u)), N = Math.max(seq.length,1), d = clamp(330/Math.sqrt(N),14,40), s = d-3, b = d/(2*Math.PI); let th = 2*Math.PI, pts = [];
  while(pts.length < seq.length){ const rr = b*th; pts.push([rr*Math.cos(th), rr*Math.sin(th)]); th += d/rr; }
  const Rm = b*th + s/2 + 4; let o=''; pts.forEach((p,k) => o += ic(Rm+p[0]-s/2, Rm+p[1]-s/2, s, c.col(seq[k].i), c.icon(seq[k].i)));
  const lg = legendV(c, 2*Rm+40, 10); o += lg.svg; return {svg:o, h:Math.max(2*Rm, lg.h+10), unit:true}; },

spokes(c){ const R0=250, r0=48, s = clamp(2*Math.PI*r0/c.n*0.7, 10, 16), cap = Math.floor((R0-r0)/(s+3)), u = c.U(c.max,cap), cx = IW/2, cy = R0+44; let o=`<circle cx="${cx}" cy="${cy}" r="${r0-12}" fill="${c.empty}"/>`;
  o += tx(cx, cy-6, fmt(c.total), {anchor:'middle', weight:700, size:16}) + tx(cx, cy+12, t('total'), {anchor:'middle', size:11, color:P.muted});
  c.d.forEach((d,k) => { const a = 2*Math.PI*k/c.n - Math.PI/2, cnt = d.value/u, n = Math.ceil(cnt-0.04);
    for(let j=0;j<n;j++){ const rr = r0 + j*(s+3) + s/2, fr = Math.min(1,cnt-j); o += ic(cx+rr*Math.cos(a)-s/2, cy+rr*Math.sin(a)-s/2, s, c.col(d.i), c.icon(d.i), fr<0.999?{frac:fr,empty:c.empty}:{}); }
    const lr = r0 + Math.max(1,n)*(s+3) + 14, ca = Math.cos(a); o += tx(cx+lr*ca, cy+lr*Math.sin(a), `${trunc(d.name,150,13)} · ${fmt(d.value)}`, {anchor: ca>0.3?'start':ca<-0.3?'end':'middle', size:13, weight:600, color:c.col(d.i)}); });
  return {svg:o, h:2*R0+88, unit:true}; },

parliament(c){ const u = c.U(c.total,250), seq = seqColors(c,counts(c,u)), N = seq.length, Rm = Math.min(IW/2-10, 290), r0 = Rm*0.38; let rows=1, rs, rad=[];
  for(; rows<60; rows++){ rs = (Rm-r0)/rows; rad = [...Array(rows)].map((_,k) => r0+rs*(k+0.5)); if(rad.reduce((a,R)=>a+Math.floor(Math.PI*R/rs),0) >= N) break; }
  const sumR = rad.reduce((a,b)=>a+b,0), seats = rad.map(R => Math.floor(N*R/sumR)); let rem = N - seats.reduce((a,b)=>a+b,0); for(let k=rows-1; rem>0; k=(k-1+rows)%rows){ seats[k]++; rem--; }
  const s = rs*0.82, cx = IW/2, cy = Rm+s/2+4, pts=[]; rad.forEach((R,k) => { const m = seats[k]; for(let j=0;j<m;j++){ const a = m===1 ? Math.PI/2 : Math.PI*(1-j/(m-1)); pts.push({a, x:cx+R*Math.cos(a), y:cy-R*Math.sin(a)}); } });
  pts.sort((p,q) => q.a-p.a); let o=''; pts.forEach((p,k) => { const d = seq[k]; if(d) o += ic(p.x-s/2, p.y-s/2, s, c.col(d.i), c.icon(d.i)); });
  o += tx(cx, cy-34, fmt(c.total), {anchor:'middle', size:34, weight:700}) + tx(cx, cy-6, t('total'), {anchor:'middle', size:14, color:P.muted});
  const lg = legendH(c, cy+24, {val:true}); return {svg:o+lg.svg, h:cy+24+lg.h, unit:true}; },

honey(c){ const u = c.U(c.total,160), seq = seqColors(c,counts(c,u)), N = seq.length, per = N<=40?10:N<=90?14:18, w = Math.min(58, IW/(per+0.5)), hr = w/Math.sqrt(3), rh = hr*1.5, ox = (IW-(per+0.5)*w)/2; let o='';
  seq.forEach((d,k) => { const row = Math.floor(k/per), col = k%per, cx = ox + col*w + w/2 + (row%2 ? w/2 : 0), cy = hr + row*rh, hh = hr*0.95, cl = c.col(d.i);
    const pts = [...Array(6)].map((_,j) => { const a = (60*j-90)*Math.PI/180; return `${r(cx+hh*Math.cos(a))},${r(cy+hh*Math.sin(a))}`; }).join(' ');
    o += `<polygon points="${pts}" fill="${cl}"/>` + ic(cx-hr*0.45, cy-hr*0.45, hr*0.9, contrast(cl), c.icon(d.i), {opacity:.9}); });
  const h = 2*hr + (Math.ceil(N/per)-1)*rh, lg = legendH(c, h+18, {val:true}); return {svg:o+lg.svg, h:h+18+lg.h, unit:true}; },

pyramid(c){ const u = c.U(c.total,136), seq = seqColors(c,counts(c,u)), N = seq.length; let K=1; while(K*(K+1)/2 < N) K++;
  const s = Math.min(34, IW/K-4, 440/K-4), g=4; let o='', k=0;
  for(let row=0; row<K; row++){ const m = row+1, x0 = IW/2 - (m*(s+g)-g)/2; for(let j=0;j<m;j++,k++){ const d = seq[k]; o += ic(x0+j*(s+g), row*(s+g), s, d?c.col(d.i):c.empty, d?c.icon(d.i):S.icon); } }
  const h = K*(s+g), lg = legendH(c, h+16, {val:true}); return {svg:o+lg.svg, h:h+16+lg.h, unit:true}; },

clusters(c){ const u = c.U(c.max,80), cols = Math.min(c.n,4), cw = IW/cols, s=16, cf=s*0.66, Rm = cf*Math.sqrt(80)+s, ch = 2*Rm+56; let o='';
  c.d.forEach((d,k) => { const cx = (k%cols)*cw + cw/2 + rowShift(k,c.n,cols,cw), cy = Math.floor(k/cols)*ch + Rm, n = Math.round(d.value/u);
    for(let j=0;j<n;j++){ const rr = cf*Math.sqrt(j+0.5), a = j*2.39996; o += ic(cx+rr*Math.cos(a)-s/2, cy+rr*Math.sin(a)-s/2, s, c.col(d.i), c.icon(d.i)); }
    o += tx(cx, cy+Rm+8, fmt(d.value), {anchor:'middle', weight:700, size:16, color:c.col(d.i)}) + tx(cx, cy+Rm+30, trunc(d.name,cw-10,13), {anchor:'middle', size:13}); });
  return {svg:o, h:Math.ceil(c.n/cols)*ch-14, unit:true}; },

timeline(c){ const s=20, g=3, cap=8, u = c.U(c.max,cap), st = IW/c.n, half = cap*(s+g)+46, ay = half; let o=`<line x1="0" x2="${IW}" y1="${ay}" y2="${ay}" stroke="${P.muted}" stroke-width="2" stroke-opacity=".5"/>`;
  c.d.forEach((d,k) => { const cx = st*k + st/2, up = k%2===0, cnt = d.value/u, n = Math.ceil(cnt-0.04), col = c.col(d.i);
    o += `<circle cx="${r(cx)}" cy="${ay}" r="7" fill="${col}" stroke="${P.bg}" stroke-width="3"/>`;
    for(let j=0;j<n;j++){ const fr = Math.min(1,cnt-j), y = up ? ay-18-(j+1)*(s+g) : ay+18+j*(s+g); o += ic(cx-s/2, y, s, col, c.icon(d.i), fr<0.999?{frac:fr,empty:c.empty,vertical:true}:{}); }
    const vy = up ? ay-18-n*(s+g)-12 : ay+18+n*(s+g)+10; o += tx(cx, vy, fmt(d.value), {anchor:'middle', weight:700, size:13, color:col});
    o += tx(cx, up ? ay+22 : ay-22, trunc(d.name, st*1.8, 13), {anchor:'middle', size:13, weight:600}); });
  return {svg:o, h:2*half, unit:true}; },

tally(c){ const lw = labelW(c), gw=44, x0 = lw+34, cap = Math.max(5, Math.floor((IW-x0-80)/gw)*5), u = c.U(c.max,cap), rh=44; let o='';
  c.d.forEach((d,k) => { const y = k*rh, col = c.col(d.i), m = Math.round(d.value/u); o += tx(lw-12, y+14, trunc(d.name,lw-16), {anchor:'end'}) + ic(lw, y+3, 22, col, c.icon(d.i));
    for(let j=0;j<m;j++){ const gi = Math.floor(j/5), p = j%5, gx = x0 + gi*gw; o += p<4 ? `<line x1="${gx+p*8}" x2="${gx+p*8}" y1="${y}" y2="${y+28}" stroke="${col}" stroke-width="3.2" stroke-linecap="round"/>` : `<line x1="${gx-4}" x2="${gx+28}" y1="${y+24}" y2="${y+4}" stroke="${col}" stroke-width="3.2" stroke-linecap="round"/>`; }
    o += tx(x0 + Math.ceil(m/5)*gw + 4, y+14, fmt(d.value), {weight:700, color:col}); });
  return {svg:o, h:c.n*rh-14, unit:true, unitText:S.lang==='th'?'1 ขีด':'1 mark'}; },

kpi(c){ const cols = c.n<=4 ? c.n : c.n<=6 ? 3 : 4, gp=16, cw = (IW-(cols-1)*gp)/cols, chh=156; let o='';
  c.d.forEach((d,k) => { const x = (k%cols)*(cw+gp) + rowShift(k,c.n,cols,cw+gp), y = Math.floor(k/cols)*(chh+gp), col = c.col(d.i), bw = cw-36;
    o += `<rect x="${r(x)}" y="${y}" width="${r(cw)}" height="${chh}" rx="14" fill="${col}" fill-opacity=".12"/>` + ic(x+18, y+18, 40, col, c.icon(d.i)) + tx(x+cw-18, y+30, pc(d.value,c.total), {anchor:'end', size:13, weight:700, color:P.muted});
    o += tx(x+18, y+86, fmt(d.value), {size:30, weight:700, color:col}) + tx(x+18, y+116, trunc(d.name,cw-36,14), {size:14});
    o += `<rect x="${r(x+18)}" y="${y+134}" width="${r(bw)}" height="6" rx="3" fill="${c.empty}"/><rect x="${r(x+18)}" y="${y+134}" width="${r(bw*(c.max?d.value/c.max:0))}" height="6" rx="3" fill="${col}"/>`; });
  return {svg:o, h:Math.ceil(c.n/cols)*(chh+gp)-gp}; },

heat(c){ const cols = Math.min(c.n,5), gp=10, tw = (IW-(cols-1)*gp)/cols, th=130, base = P.colors[0]; let o='';
  c.d.forEach((d,k) => { const x = (k%cols)*(tw+gp) + rowShift(k,c.n,cols,tw+gp), y = Math.floor(k/cols)*(th+gp), f = c.max ? d.value/c.max : 0, fill = mix(P.bg, base, 0.12+0.88*f), tc = contrast(fill);
    o += `<rect x="${r(x)}" y="${y}" width="${r(tw)}" height="${th}" rx="10" fill="${fill}"/>` + ic(x+tw/2-20, y+16, 40, tc, c.icon(d.i), {opacity:.9}) + tx(x+tw/2, y+80, fmt(d.value), {anchor:'middle', weight:700, size:20, color:tc}) + tx(x+tw/2, y+106, trunc(d.name,tw-14,13), {anchor:'middle', size:13, color:tc}); });
  const h = Math.ceil(c.n/cols)*(th+gp)-gp, lx = IW/2-110, gy = h+16; let lg = `<defs><linearGradient id="hg${UID}"><stop offset="0" stop-color="${mix(P.bg,base,0.12)}"/><stop offset="1" stop-color="${base}"/></linearGradient></defs><rect x="${lx}" y="${gy}" width="220" height="10" rx="5" fill="url(#hg${UID++})"/>`;
  lg += tx(lx-8, gy+5, S.lang==='th'?'น้อย':'Low', {anchor:'end', size:12, color:P.muted}) + tx(lx+228, gy+5, S.lang==='th'?'มาก':'High', {size:12, color:P.muted});
  return {svg:o+lg, h:gy+30}; }
};

/* ---------- Build SVG ---------- */
const THUMB_DATA = [{name:'A',value:42},{name:'B',value:30},{name:'C',value:18},{name:'D',value:10}];
function build(chartId, data, opt={}){
  P = THEMES[S.theme]; USED = new Set();
  const d = data.map((x,i) => ({name:x.name, value:Math.max(0, +x.value || 0), i}));
  const vals = d.map(x => x.value);
  const c = {d, n:d.length, total:vals.reduce((a,b)=>a+b,0), max:Math.max(0,...vals), empty:P.empty, allInt:vals.every(Number.isInteger), unit:null, adjusted:false};
  c.col = i => P.colors[i % P.colors.length];
  c.icon = i => { if(!S.vary) return S.icon; const ids = iconCat(S.icon).ids.filter(x => x!=='circle' && x!=='square'); const b = Math.max(0, ids.indexOf(S.icon)); return ids[(b+i) % ids.length]; };
  c.U = (maxVal, cap) => { const user = opt.thumb ? 0 : S.unit; let u; if(user > 0 && maxVal/user <= cap) u = user; else { u = niceUnit(maxVal/cap); if(c.allInt) u = Math.max(1,u); if(user > 0) c.adjusted = true; } c.unit = u; return u; };
  const res = R[chartId](c);
  const fontAttr = `font-family="${FONT.replace(/"/g,"'")}"`;
  const defs = () => [...USED].map(iconSymbol).join('');
  if(opt.thumb){
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 ${IW+60} ${res.h+60}" preserveAspectRatio="xMidYMid meet" ${fontAttr}><defs>${defs()}</defs><rect data-role="bg" x="-30" y="-30" width="${IW+60}" height="${res.h+60}" fill="${P.bg}"/><g data-role="body">${res.svg}</g></svg>`;
  }
  let y = 0, head = '';
  if(opt.title){ let fs = 30; while(fs > 18 && measure(opt.title,fs,700) > IW) fs--; head += tx(PAD, 46, trunc(opt.title,IW,fs,700), {size:fs, weight:700}); y = 72; } else y = 28;
  if(opt.subtitle){ head += tx(PAD, y, trunc(opt.subtitle,IW,16), {size:16, color:P.muted}); y += 30; }
  y += 14; const bodyY = y;
  // footer drawn relative to its own top (0); moved under the body after fitting
  let foot = `<line x1="${PAD}" x2="${W-PAD}" y1="0" y2="0" stroke="${P.muted}" stroke-opacity=".18"/>`, fy = 16;
  if(res.unit && c.unit){
    foot += res.unitText ? tx(PAD, fy+11, `${res.unitText} = ${fmt(c.unit)} ${opt.colValue||''}`, {size:14, color:P.muted})
                         : ic(PAD, fy, 22, P.colors[0], c.icon(0)) + tx(PAD+30, fy+11, `= ${fmt(c.unit)} ${opt.colValue||''}`, {size:14, color:P.muted});
    fy += 34;
  }
  if(opt.source){ foot += tx(PAD, fy+10, trunc(t('source') + opt.source, IW, 13), {size:13, color:P.muted}); fy += 28; }
  const footY = bodyY + res.h + 16, H = Math.round(footY + fy + 10);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" data-bodyy="${bodyY}" data-footh="${fy}" ${fontAttr}><defs>${defs()}</defs><rect data-role="bg" width="${W}" height="${H}" fill="${P.bg}"/>${head}<g data-role="body" transform="translate(${PAD},${bodyY})">${res.svg}</g><g data-role="foot" transform="translate(0,${footY})">${foot}</g></svg>`;
  return {svg, c};
}
/* Measure the drawn chart and centre / scale it to fill the canvas width */
const MAX_FIT = 1.6, MAX_BODY_H = 820;
function fitChart(svg){
  const body = svg.querySelector('[data-role=body]'), foot = svg.querySelector('[data-role=foot]');
  if(!body || !foot) return;
  const bb = body.getBBox(); if(!bb.width || !bb.height) return;
  let k = IW / bb.width;                                   // fill available width
  if(S.fit === false) k = Math.min(1, k);                  // shrink only (no enlarge) when fill is off
  k = Math.min(k, MAX_FIT);
  if(k > 1) k = Math.max(1, Math.min(k, MAX_BODY_H / bb.height)); // don't let tall charts balloon
  const bodyY = +svg.dataset.bodyy, footH = +svg.dataset.footh;
  const x = PAD + (IW - bb.width*k)/2 - bb.x*k, y = bodyY - bb.y*k, bh = bb.height*k;
  body.setAttribute('transform', `translate(${r(x)},${r(y)}) scale(${Math.round(k*1000)/1000})`);
  const footY = bodyY + bh + 18; foot.setAttribute('transform', `translate(0,${r(footY)})`);
  const H = Math.round(footY + footH + 10);
  svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.querySelector('[data-role=bg]').setAttribute('height', H);
}
function fitThumb(svg){
  const body = svg.querySelector('[data-role=body]'); if(!body) return;
  const bb = body.getBBox(); if(!bb.width || !bb.height) return;
  const p = Math.max(bb.width, bb.height) * 0.06, vb = [bb.x-p, bb.y-p, bb.width+2*p, bb.height+2*p];
  svg.setAttribute('viewBox', vb.map(r).join(' '));
  const bg = svg.querySelector('[data-role=bg]'); ['x','y','width','height'].forEach((a,i) => bg.setAttribute(a, r(vb[i])));
}
if(typeof module !== 'undefined') module.exports = {build, R, CHARTS, S, THEMES, ICON_IDS};

/* ---------- UI ---------- */
if(typeof document !== 'undefined') (function(){
  const $ = id => document.getElementById(id);
  const rowsEl = $('rows');
  let lastSVG = null;

  function addRow(name='', val=''){
    const div = document.createElement('div'); div.className = 'tr';
    div.innerHTML = `<input class="nm"><input class="vl" type="text" inputmode="decimal"><button class="del" title="ลบ / Delete">×</button>`;
    div.querySelector('.nm').value = name; div.querySelector('.vl').value = val;
    div.querySelector('.nm').placeholder = t('phName'); div.querySelector('.vl').placeholder = t('phVal');
    div.querySelector('.del').onclick = () => { div.remove(); if(!rowsEl.children.length) addRow(); };
    rowsEl.appendChild(div); return div;
  }
  const parseNum = v => { if(typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[,\s฿$%]/g,'')); return isNaN(n) ? null : n; };
  function readData(){ return [...rowsEl.children].map(tr => ({name:tr.querySelector('.nm').value.trim(), value:parseNum(tr.querySelector('.vl').value)})).filter(x => x.name && x.value != null && x.value >= 0); }
  function setRows(arr){ rowsEl.innerHTML = ''; arr.forEach(([n,v]) => addRow(n, v)); if(!arr.length){ addRow(); addRow(); addRow(); } }
  function status(msg, cls=''){ const s = $('status'); s.textContent = msg; s.className = 'status ' + cls; }
  const chartName = id => { const ch = CHARTS.find(x => x[0]===id); return S.lang==='th' ? ch[2] : ch[3]; };

  function renderCharts(){
    const box = $('charts'); box.innerHTML = ''; const thumbs = [];
    CATS.forEach(cat => {
      const h = document.createElement('div'); h.className = 'cat'; h.textContent = cat[S.lang]; box.appendChild(h);
      const grid = document.createElement('div'); grid.className = 'cgrid'; box.appendChild(grid);
      CHARTS.filter(ch => ch[1]===cat.id).forEach(ch => {
        const b = document.createElement('button'); b.className = 'chart-opt' + (S.chart===ch[0] ? ' on' : ''); b.dataset.id = ch[0];
        let th = ''; try { th = build(ch[0], THUMB_DATA, {thumb:true}); } catch(e){ th = ''; }
        b.innerHTML = `<div class="thumb">${th}</div>${S.lang==='th'?ch[2]:ch[3]}`; thumbs.push(b);
        b.onclick = () => { S.chart = ch[0]; document.querySelectorAll('.chart-opt').forEach(x => x.classList.toggle('on', x.dataset.id===S.chart)); $('curChart').textContent = chartName(S.chart); if(S.processed) process(true); };
        grid.appendChild(b);
      });
    });
    thumbs.forEach(b => { const sv = b.querySelector('svg'); if(sv) try{ fitThumb(sv); }catch(e){} });
  }
  function renderIcons(){
    const box = $('icons'), q = $('iconSearch').value.trim().toLowerCase(), catSel = $('iconCat').value || 'all';
    const sel = $('iconCat'); sel.innerHTML = `<option value="all">${t('allCats')} (${ICON_IDS.length})</option>` + ICON_CATS.map(cg => `<option value="${cg.id}">${cg[S.lang]} (${cg.ids.length})</option>`).join(''); sel.value = catSel;
    $('iconName').textContent = ICONS[S.icon][S.lang==='th'?0:1];
    box.innerHTML = ''; let shown = 0;
    ICON_CATS.filter(cg => catSel==='all' || cg.id===catSel).forEach(cg => {
      const ids = cg.ids.filter(id => !q || (ICONS[id][0]+' '+ICONS[id][1]+' '+id).toLowerCase().includes(q));
      if(!ids.length) return;
      const h = document.createElement('div'); h.className = 'cat'; h.textContent = cg[S.lang]; box.appendChild(h);
      const grid = document.createElement('div'); grid.className = 'icons'; box.appendChild(grid);
      ids.forEach(id => { shown++; const btn = document.createElement('button'); btn.className = 'icon-opt' + (S.icon===id ? ' on' : ''); btn.dataset.id = id; btn.title = ICONS[id][S.lang==='th'?0:1];
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path fill-rule="${ICONS[id][3]||'evenodd'}" d="${ICONS[id][2]}"/></svg>`;
        btn.onclick = () => { S.icon = id; box.querySelectorAll('.icon-opt').forEach(x => x.classList.toggle('on', x.dataset.id===id)); $('iconName').textContent = ICONS[id][S.lang==='th'?0:1]; renderCharts(); if(S.processed) process(true); };
        grid.appendChild(btn); });
    });
    if(!shown) box.innerHTML = `<div class="hint" style="padding:12px 0">${t('noIcon')}</div>`;
    $('iconCount').textContent = t('iconCount').replace('{n}', shown);
  }
  function renderThemes(){
    const box = $('themes'); box.innerHTML = '';
    Object.entries(THEMES).forEach(([id,th]) => { const b = document.createElement('button'); b.className = 'theme-opt' + (S.theme===id ? ' on' : '');
      b.innerHTML = `${th[S.lang]}<div class="sw" style="outline:1px solid #0001">${th.colors.map(cl => `<span style="background:${cl}"></span>`).join('')}<span style="background:${th.bg};flex:.6"></span></div>`;
      b.onclick = () => { S.theme = id; renderThemes(); renderCharts(); if(S.processed) process(true); }; box.appendChild(b); });
  }
  function showEmpty(){ $('preview').innerHTML = `<div class="empty"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg><div>${t('empty')}</div></div>`; }

  function applyLang(){
    document.documentElement.lang = S.lang;
    $('lang-th').classList.toggle('on', S.lang==='th'); $('lang-en').classList.toggle('on', S.lang==='en');
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t(el.dataset.ph));
    rowsEl.querySelectorAll('.nm').forEach(el => el.placeholder = t('phName'));
    rowsEl.querySelectorAll('.vl').forEach(el => el.placeholder = t('phVal'));
    const other = S.lang==='th' ? 'en' : 'th';
    if(!$('colName').value || $('colName').value === I18N[other].colName) $('colName').value = t('colName');
    if(!$('colValue').value || $('colValue').value === I18N[other].colValue) $('colValue').value = t('colValue');
    $('curChart').textContent = chartName(S.chart);
    renderCharts(); renderIcons(); renderThemes();
    if(S.processed) process(true); else showEmpty();
  }

  function process(silent){
    const data = readData();
    if(!data.length){ status(t('noData'), 'err'); return; }
    S.unit = parseFloat($('unit').value) || 0; S.vary = $('vary').checked;
    try {
      const out = build(S.chart, data, {title:$('title').value.trim(), subtitle:$('subtitle').value.trim(), source:$('source').value.trim(), colValue:$('colValue').value.trim()});
      $('preview').innerHTML = out.svg; lastSVG = $('preview').querySelector('svg'); fitChart(lastSVG);
      S.processed = true; $('downloadBtn').disabled = false;
      let msg = t('done').replace('{c}', chartName(S.chart)); if(out.c.adjusted) msg += t('adj').replace('{u}', fmt(out.c.unit));
      status(msg, 'ok');
    } catch(e){ console.error(e); status(t('err') + e.message, 'err'); }
  }

  /* Excel import */
  $('uploadBtn').onclick = () => $('file').click();
  $('file').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      let aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true}).filter(row => row.some(v => String(v).trim() !== ''));
      if(!aoa.length) throw new Error('empty');
      const width = Math.max(...aoa.map(row => row.length));
      let vc = 1; for(let k=1; k<width; k++){ if(aoa.slice(1).filter(row => parseNum(row[k]) != null).length >= Math.max(1,(aoa.length-1)/2)){ vc = k; break; } }
      let head = null; if(parseNum(aoa[0][vc]) == null){ head = aoa[0]; aoa = aoa.slice(1); }
      if(head){ if(String(head[0]).trim()) $('colName').value = String(head[0]).trim(); if(String(head[vc]).trim()) $('colValue').value = String(head[vc]).trim(); }
      const rows = aoa.map(row => [String(row[0]).trim(), parseNum(row[vc])]).filter(x => x[0] && x[1] != null);
      if(!rows.length) throw new Error('no rows');
      setRows(rows); if(!$('title').value.trim()) $('title').value = wb.SheetNames[0] && !/^sheet\d*$/i.test(wb.SheetNames[0]) ? wb.SheetNames[0] : '';
      status(t('loaded').replace('{n}', rows.length).replace('{f}', f.name), 'ok');
    } catch(err){ console.error(err); status(t('fileErr'), 'err'); }
    e.target.value = '';
  };
  $('templateBtn').onclick = () => {
    const ws = XLSX.utils.aoa_to_sheet([[$('colName').value || t('colName'), $('colValue').value || t('colValue')], ...t('sampleRows')]);
    ws['!cols'] = [{wch:24},{wch:12}];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data'); XLSX.writeFile(wb, 'pictogram-template.xlsx');
  };
  $('sampleBtn').onclick = () => { setRows(t('sampleRows')); $('title').value = t('sampleTitle'); $('colName').value = t('colName'); $('colValue').value = t('colValue'); };
  $('addRow').onclick = () => addRow().querySelector('.nm').focus();
  rowsEl.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.classList.contains('vl')){ e.preventDefault(); const nx = e.target.closest('.tr').nextElementSibling || addRow(); nx.querySelector('.nm').focus(); } });

  /* PNG export with embedded Thai font */
  let fontCache = null;
  async function fontCSS(){
    if(fontCache !== null) return fontCache;
    try {
      let css = await (await fetch('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap')).text();
      const urls = [...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))];
      for(const u of urls){ const b = await (await fetch(u)).blob(); const d = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); }); css = css.split(u).join(d); }
      fontCache = css;
    } catch(e){ fontCache = ''; }
    return fontCache;
  }
  $('downloadBtn').onclick = async () => {
    if(!lastSVG){ status(t('needProcess'), 'err'); return; }
    status(t('saving'));
    let src = new XMLSerializer().serializeToString(lastSVG);
    const css = await fontCSS(); if(css) src = src.replace('<defs>', `<defs><style>${css}</style>`);
    const w = +lastSVG.getAttribute('width'), h = +lastSVG.getAttribute('height'), scale = 2;
    const url = URL.createObjectURL(new Blob([src], {type:'image/svg+xml;charset=utf-8'}));
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = w*scale; cv.height = h*scale;
      const cx = cv.getContext('2d'); cx.fillStyle = THEMES[S.theme].bg; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = (($('title').value.trim() || 'pictogram').replace(/[\\/:*?"<>|]+/g,'_').slice(0,60)) + '.png'; document.body.appendChild(a); a.click(); a.remove(); status(t('saved'), 'ok'); }, 'image/png');
    };
    img.onerror = () => status('PNG error', 'err');
    img.src = url;
  };

  /* Reset */
  $('resetBtn').onclick = () => {
    ['title','subtitle','source','unit','iconSearch'].forEach(id => $(id).value = ''); $('iconCat').value = 'all';
    $('colName').value = t('colName'); $('colValue').value = t('colValue'); $('vary').checked = false;
    $('fit').checked = true; Object.assign(S, {fit:true, chart:'hbar', icon:'person', vary:false, theme:'ocean', unit:0, processed:false});
    lastSVG = null; $('downloadBtn').disabled = true; setRows([]); $('curChart').textContent = chartName(S.chart);
    renderCharts(); renderIcons(); renderThemes(); showEmpty(); status(t('resetDone'), 'ok');
    window.scrollTo({top:0, behavior:'smooth'});
  };

  $('fit').onchange = () => { S.fit = $('fit').checked; if(S.processed) process(true); };
  $('iconSearch').oninput = renderIcons;
  $('iconCat').onchange = renderIcons;
  $('processBtn').onclick = () => process();
  $('vary').onchange = () => { S.vary = $('vary').checked; renderCharts(); if(S.processed) process(true); };
  $('lang-th').onclick = () => { S.lang = 'th'; applyLang(); };
  $('lang-en').onclick = () => { S.lang = 'en'; applyLang(); };

  /* init with sample data */
  $('colName').value = t('colName'); $('colValue').value = t('colValue');
  setRows(t('sampleRows')); $('title').value = t('sampleTitle');
  applyLang(); process(true);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderCharts(); if(S.processed) process(true); });
})();
</script>
